# Generated with xcodegen: `cd ios/FlockSquawk && xcodegen generate`
#
# The .xcodeproj is NOT committed. It is a large, merge-hostile generated file,
# and it would carry a developer team ID into a public repo. This spec is the
# source of truth; regenerate after changing it.
name: Squawker
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FlockCore:
    path: ../FlockCore

targets:
  Squawker:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: FlockCore
        product: FlockCore
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Squawker
        # Filled from BACKEND_BASE_URL in Signing.local.xcconfig (gitignored),
        # so a public repo never names a real deployment.
        BackendBaseURL: $(BACKEND_BASE_URL)
        UIRequiredDeviceCapabilities: [armv7, bluetooth-le]
        # Both modes are required, and location is the load-bearing one: it is
        # what keeps the process alive. Relying on BLE-only background wakeups,
        # which iOS throttles hard, makes notification delivery to a pocketed
        # phone unreliable.
        UIBackgroundModes:
          - location
          - bluetooth-central
        # Missing any of these is an immediate crash on first use, not a
        # silent denial.
        NSLocationWhenInUseUsageDescription:
          Stamps each detected camera with where it was seen.
        NSLocationAlwaysAndWhenInUseUsageDescription:
          Keeps recording detections while the phone is locked or the app is in
          the background.
        NSBluetoothAlwaysUsageDescription:
          Connects to your detector to receive camera sightings.
